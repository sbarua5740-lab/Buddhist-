<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ত্রিপিটক এআই সার্চ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf7ef;--card:#fff;--ink:#2b2118;--muted:#7a6a58;--accent:#b45309;--line:#eadfcf}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Serif Bengali",serif;background:var(--bg);color:var(--ink);line-height:1.85}
header{text-align:center;padding:36px 16px 8px}
h1{margin:0;font-size:2rem;color:var(--accent)}
.sub{color:var(--muted);margin-top:6px;font-size:.98rem}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 60px}
.searchbox{display:flex;gap:8px;margin:22px 0 12px}
input[type=text]{flex:1;padding:14px 16px;font-size:1.05rem;border:1px solid var(--line);border-radius:12px;font-family:inherit;background:#fff;color:var(--ink)}
button{padding:12px 18px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:1rem;cursor:pointer;font-family:inherit}
button:disabled{opacity:.5;cursor:default}
.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 18px}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:.9rem;cursor:pointer;color:var(--ink);font-family:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-top:18px}
.card p{margin:.45em 0}
.card ul{padding-left:1.3em;margin:.4em 0}
.card h3{margin:.8em 0 .3em;color:var(--accent);font-size:1.08rem}
.sources{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line);font-size:.92rem;color:var(--muted)}
.sources a{color:var(--accent);word-break:break-all}
.status{color:var(--muted);font-style:italic}
.err{color:#b91c1c;white-space:pre-wrap;word-break:break-word}
#settings{display:none;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px}
#settings label{display:block;margin:10px 0 4px;font-size:.95rem}
#settings input,#settings select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:.95rem;background:#fff;color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.linkbtn{background:none;color:var(--accent);padding:4px 0;font-size:.9rem}
.note{font-size:.85rem;color:var(--muted);margin-top:34px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>ত্রিপিটক এআই সার্চ</h1>
  <div class="sub">বৌদ্ধ ধর্মের যেকোনো প্রশ্ন করুন — উত্তর আসবে ত্রিপিটক ও বিশ্বস্ত উৎস থেকে, রেফারেন্সসহ</div>
</header>

<div class="wrap">
  <form id="form" class="searchbox">
    <input id="q" type="text" placeholder="আপনার প্রশ্ন লিখুন… (যেমন: পঞ্চশীল কী?)" autocomplete="off" required>
    <button id="go" type="submit">খুঁজুন</button>
  </form>

  <div class="chips" id="chips"></div>

  <div class="row">
    <button class="linkbtn" id="toggleSettings" type="button">⚙ API সেটিংস</button>
  </div>

  <div id="settings">
    <label for="apiKey">Anthropic API Key</label>
    <input id="apiKey" type="password" placeholder="sk-ant-...">
    <label for="model">মডেল</label>
    <select id="model">
      <option value="claude-sonnet-5-5">Claude Sonnet 5.5 (সুপারিশকৃত)</option>
      <option value="claude-haiku-5-5">Claude Haiku 5.5 (দ্রুত ও সস্তা)</option>
      <option value="claude-opus-5-5">Claude Opus 5.5 (সবচেয়ে গভীর)</option>
    </select>
    <div class="row">
      <button id="save" type="button">সংরক্ষণ করুন</button>
      <button id="clearKey" type="button" class="ghost">কী মুছুন</button>
    </div>
  </div>

  <div id="result"></div>

  <div class="note">
    এই পাতা শুধু শিক্ষা ও গবেষণার উদ্দেশ্যে। গুরুত্বপূর্ণ রেফারেন্স মূল ত্রিপিটকের সাথে মিলিয়ে যাচাই করে নিন।
  </div>
</div>

<script>
const SYSTEM_PROMPT = `তুমি একজন বৌদ্ধ ধর্ম, পালি ত্রিপিটক ও অট্ঠকথা-বিষয়ক গবেষণা-সহায়ক। তোমার নিয়মাবলী:

1. উত্তরের মূল ভিত্তি হবে ত্রিপিটক (বিনয়পিটক, সুত্তপিটক, অভিধম্মপিটক)। প্রয়োজনে অট্ঠকথা ও টীকা উল্লেখ করবে, তবে তাকে ত্রিপিটকের বাণী হিসেবে আলাদা করে চিহ্নিত করবে। অন্য বৌদ্ধ গ্রন্থ বা পরবর্তী ঐতিহাসিক মত উল্লেখ করলে তা স্পষ্টভাবে বলবে।
2. উত্তর হবে শুদ্ধ, সহজবোধ্য বাংলায়। গুরুত্বপূর্ণ পালি শব্দের পাশে বন্ধনীতে মূল পালি বানান দেবে, যেমন: দুক্খ (দুঃখ)।
3. প্রতিটি মূল দাবির পাশে রেফারেন্স দেবে: পিটক, নিকায়/খন্ধ/বর্গ এবং সুত্তের নাম ও নম্বর। যেমন: (দীঘনিকায় ২২, মহাসতিপট্ঠান সুত্ত)।
4. প্রয়োজনে web_search ব্যবহার করে বিশ্বস্ত উৎস খুঁজবে, যেমন suttacentral.net, tipitaka.org, accesstoinsight.org এবং বিশ্বাসযোগ্য একাডেমিক সূত্র। রেফারেন্স বা উদ্ধৃতি বানাবে না। নিশ্চিত না হলে স্পষ্টভাবে লিখবে "এই বিষয়ে নিশ্চিত রেফারেন্স পাওয়া যায়নি"।
5. বিতর্কিত বা একাধিক ব্যাখ্যা থাকলে সেগুলো ন্যায্যভাবে তুলে ধরবে।
6. উত্তরের শেষে "উৎস" শিরোনামে ব্যবহৃত লিংকগুলোর তালিকা দেবে।
7. শ্রদ্ধাশীল ও নিরপেক্ষ স্বরে লিখবে। প্রশ্ন বাংলায় না হলে প্রশ্নের ভাষাতেই উত্তর দেবে।`;

const $ = id => document.getElementById(id);
const SUGGESTIONS = [
  "বুদ্ধের প্রথম ধর্মোপদেশ কোথায় আছে?",
  "পঞ্চশীল কী এবং কোথায় বর্ণিত?",
  "চারি আর্যসত্য কোন সুত্তে আছে?",
  "অনাত্মলক্ষণ সুত্তের সারমর্ম কী?",
  "দীঘনিকায়ের সামঞ্ঞফল সুত্ত কী বলে?",
  "প্রতীত্যসমুৎপাদ কী?",
  "বিনয়পিটকে ভিক্ষুদের প্রধান নিয়মগুলো কী কী?"
];

// Suggestion chips
SUGGESTIONS.forEach(s => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'chip';
  b.textContent = s;
  b.onclick = () => { $('q').value = s; $('form').requestSubmit(); };
  $('chips').appendChild(b);
});

// Settings
$('apiKey').value = localStorage.getItem('tp_key') || '';
$('model').value = localStorage.getItem('tp_model') || 'claude-sonnet-5-5';
$('toggleSettings').onclick = () => {
  const s = $('settings');
  s.style.display = s.style.display === 'block' ? 'none' : 'block';
};
$('save').onclick = () => {
  localStorage.setItem('tp_key', $('apiKey').value.trim());
  localStorage.setItem('tp_model', $('model').value);
  $('settings').style.display = 'none';
  alert('সেটিংস সংরক্ষিত হয়েছে।');
};
$('clearKey').onclick = () => {
  localStorage.removeItem('tp_key');
  $('apiKey').value = '';
  alert('API কী মুছে ফেলা হয়েছে।');
};

function esc(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Minimal markdown-like rendering: **bold**, # headings, - bullets, paragraphs
function render(text) {
  let html = '', inList = false;
  for (let raw of esc(text).split('\n')) {
    let l = raw.trim();
    l = l.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    if (/^[-*•]\s+/.test(l)) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += '<li>' + l.replace(/^[-*•]\s+/, '') + '</li>';
      continue;
    }
    if (inList) { html += '</ul>'; inList = false; }
    if (!l) continue;
    if (/^#+\s/.test(l)) html += '<h3>' + l.replace(/^#+\s/, '') + '</h3>';
    else html += '<p>' + l + '</p>';
  }
  if (inList) html += '</ul>';
  return html;
}

async function askAI(question) {
  const key = localStorage.getItem('tp_key');
  const model = localStorage.getItem('tp_model') || 'claude-sonnet-5-5';
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model,
      max_tokens: 2000,
      system: SYSTEM_PROMPT,
      tools: [{ type: 'web_search_20250305', name: 'web_search', max_uses: 5 }],
      messages: [{ role: 'user', content: question }]
    })
  });
  if (!res.ok) throw new Error(res.status + ': ' + (await res.text()));
  const data = await res.json();

  let text = '';
  const sources = [];
  for (const block of data.content) {
    if (block.type === 'text') text += block.text;
    if (block.type === 'web_search_tool_result' && Array.isArray(block.content)) {
      for (const r of block.content) {
        if (r.url && !sources.some(s => s.url === r.url)) {
          sources.push({ url: r.url, title: r.title || r.url });
        }
      }
    }
  }
  return { text, sources };
}

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const q = $('q').value.trim();
  if (!q) return;

  const result = $('result');
  if (!localStorage.getItem('tp_key')) {
    $('settings').style.display = 'block';
    result.innerHTML = '<div class="card err">প্রথমে উপরের ⚙ API সেটিংসে আপনার Anthropic API কী দিন।</div>';
    return;
  }

  $('go').disabled = true;
  result.innerHTML = '<div class="card status">ত্রিপিটক ও উৎস খোঁজা হচ্ছে… একটু অপেক্ষা করুন।</div>';

  try {
    const { text, sources } = await askAI(q);
    let html = '<div class="card">' + render(text || 'উত্তর পাওয়া যায়নি।');
    if (sources.length) {
      html += '<div class="sources"><strong>উৎস</strong><ul>' +
        sources.map(s => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`).join('') +
        '</ul></div>';
    }
    html += '</div>';
    result.innerHTML = html;
  } catch (err) {
    result.innerHTML = '<div class="card err">ত্রুটি হয়েছে:\n' + esc(err.message) + '</div>';
  } finally {
    $('go').disabled = false;
  }
});
</script>
</body>
</html>
